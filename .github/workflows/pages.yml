name: Site

# Site de présentation (GitHub Pages) : la documentation des modules est générée depuis le code
# de l'addon (tools/gen_site.py) à chaque push, puis le dossier site/ est publié.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Modules/**"
      - "Locale*.lua"
      - "CHANGELOG.md"
      - "tools/gen_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Données du site (modules, commandes, nouveautés)
        run: python3 -I tools/gen_site.py . site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
