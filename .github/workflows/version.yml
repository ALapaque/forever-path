name: Version

# Crée la version automatiquement :
#  - à chaque push sur main, lit la version en tête du CHANGELOG.md (« ## vX.Y.Z ») ;
#  - si le tag ou sa release n'existent pas encore : lint + tests, création du tag si besoin,
#    empaquetage et publication (GitHub Releases, et CurseForge / Wago si les secrets sont configurés).
# Lancement manuel possible depuis l'onglet Actions (« Run workflow »).
# Rejouable : une version déjà publiée n'est jamais republiée.
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .github/workflows/version.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.3.0 ou v0.3.0-beta1). Vide = celle du CHANGELOG."
        required: false
        type: string

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_exists: ${{ steps.v.outputs.tag_exists }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire la version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="$(bash tools/changelog_version.sh CHANGELOG.md)"
          fi
          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version invalide : ${version} (attendu vX.Y.Z ou vX.Y.Z-beta1)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "La release ${version} existe déjà : rien à publier."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "À publier : ${version}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag déjà créé (run précédent) : on publie exactement ce commit-là.
      - name: Se placer sur le tag existant
        if: needs.check.outputs.tag_exists == 'true'
        run: git checkout -q "refs/tags/${VERSION}"

      - name: Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          args: --no-color -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de l'addon
        run: |
          pip install lupa
          python3 tests/harness.py
          python3 tests/harness.py . tests/test_daylight.lua
          python3 tests/harness.py . tests/test_journeys.lua
          mkdir -p /tmp/fakeadt/Kalimdor
          python3 tests/make_fake_adt.py /tmp/fakeadt/Kalimdor/Kalimdor_32_32.adt
          python3 tools/bake_terrain.py --out /tmp/fp_terrain --map Kalimdor=1 /tmp/fakeadt/Kalimdor
          python3 tests/harness.py . tests/test_terrain.lua
          python3 tests/harness.py . tests/test_comfort.lua
          python3 tests/harness.py . tests/test_social.lua
          python3 tools/check_glyphs.py

      - name: Créer le tag
        if: needs.check.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "ForeverPath ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      # Le packager ignore un push de branche dont le commit est tagué (il attend un
      # workflow déclenché par le tag, qui ne viendra pas : un tag poussé avec GITHUB_TOKEN
      # ne déclenche aucun workflow). On lui indique donc qu'on publie le tag.
      - name: Récupérer le packager BigWigs (v2)
        uses: actions/checkout@v4
        with:
          repository: BigWigsMods/packager
          ref: v2
          path: .packager
      - name: Empaqueter et publier
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv .packager "${RUNNER_TEMP}/packager"
          GITHUB_REF="refs/tags/${VERSION}" GITHUB_EVENT_NAME="push" \
            bash "${RUNNER_TEMP}/packager/release.sh"

      - name: Vérifier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json tagName,isPrerelease,assets \
            --jq '"Release \(.tagName) — pré-version : \(.isPrerelease) — fichiers : \([.assets[].name] | join(", "))"'
          {
            echo "### ForeverPath ${VERSION} publiée"
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
